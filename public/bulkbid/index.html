<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BulkBid Marketplace Demo</title><style>:root{--d:#0b1220;--l:#d9ff57;--p:#f5f6f2;--m:#667085;--b:#e4e7ec;--g:#147a4b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--p);color:#111827}button,input,select{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.w{width:min(1160px,calc(100% - 28px));margin:auto}.top{background:var(--d);color:#fff;text-align:center;padding:9px;font-size:13px}.nav{display:flex;justify-content:space-between;align-items:center;padding:17px 0}.logo{font-size:25px;font-weight:900;display:flex;gap:9px;align-items:center;cursor:pointer}.mark{width:38px;height:38px;border-radius:10px;background:var(--l);display:grid;place-items:center}.btn,.ghost{border:0;border-radius:11px;padding:11px 15px;font-weight:900}.btn{background:var(--l)}.ghost{background:#fff;border:1px solid var(--b)}.hero{background:linear-gradient(135deg,#0b1220,#21324c);color:#fff;border-radius:25px;padding:50px}.hero h1{font-size:clamp(42px,7vw,72px);line-height:.96;letter-spacing:-.05em;margin:15px 0}.hero h1 span{color:var(--l)}.hero p{color:#cbd5e1;font-size:19px;max-width:760px;line-height:1.5}.stats,.grid,.market,.metrics,.unit,.two{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,1fr);margin-top:18px}.stat,.card,.panel,.side,.gallery,.qa,.uline{background:#fff;border:1px solid var(--b);border-radius:18px}.stat{padding:15px}.stat b{display:block;font-size:22px}.section{padding:42px 0}.head{display:flex;justify-content:space-between;align-items:end;gap:14px;margin-bottom:18px}.head h2{font-size:34px;margin:0}.muted{color:var(--m);font-size:13px;line-height:1.5}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{border:1px solid var(--b);background:#fff;border-radius:999px;padding:8px 12px;font-weight:800}.filter.active{background:var(--d);color:#fff}.search{display:grid;grid-template-columns:1fr 190px;gap:10px;margin-bottom:16px}.search input,.search select,.ask input,.bidrow input{width:100%;padding:12px;border:1px solid var(--b);border-radius:11px;background:#fff}.grid{grid-template-columns:repeat(3,1fr)}.card{overflow:hidden;cursor:pointer}.art{height:155px;background:linear-gradient(135deg,#eef1ea,#dce4d8);display:grid;place-items:center;font-size:65px;position:relative}.badge{position:absolute;left:10px;top:10px;background:#fff;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:900}.body{padding:16px}.body h3{margin:0 0 6px}.compare,.price,.social,.seller{display:flex;justify-content:space-between;gap:10px}.compare{background:#f7f8f5;border-radius:11px;padding:10px;margin:12px 0;font-size:12px}.compare b{display:block;font-size:15px}.price{align-items:end}.price strong{font-size:24px}.social{justify-content:flex-start;flex-wrap:wrap;margin-top:10px;color:var(--m);font-size:12px;font-weight:800}.reserve{color:var(--g);font-size:11px;font-weight:900;margin-top:8px}.detail{padding:15px 0 50px}.crumb{color:var(--m);font-size:13px;margin:8px 0 16px}.two{grid-template-columns:1.15fr .85fr}.gallery,.side,.qa,.uline,.panel{padding:20px}.mainart{height:360px;border-radius:15px;background:linear-gradient(135deg,#eef1ea,#dce4d8);display:grid;place-items:center;font-size:140px}.side h1{font-size:34px;line-height:1.02;margin:12px 0}.seller{background:#f7f8f5;border-radius:13px;padding:12px;align-items:center}.avatar{width:42px;height:42px;border-radius:50%;background:var(--d);color:#fff;display:grid;place-items:center;font-weight:900}.sellerleft{display:flex;gap:9px;align-items:center}.verified{background:#ecfdf3;color:#166534;border-radius:999px;padding:4px 7px;font-size:11px;font-weight:900}.clock{background:var(--d);color:#fff;border-radius:15px;padding:15px;margin:15px 0}.clock b{display:block;font-size:26px;margin-top:4px}.metrics{grid-template-columns:repeat(2,1fr)}.metric{background:#f7f8f5;border-radius:12px;padding:12px}.metric small{displ es',sub:'36 × 36 × 36 in · Heavy-duty',qty:600,unit:'boxes',cur:7200,buy:14800,uv:55,nv:33000,bids:9,unique:7,watch:94,end:N+4*D+11*H,loc:'Elkhart, IN',uline:'https://www.uline.com/Product/Detail/S-11300/Corrugated-Boxes-Heavy-Duty/36-x-36-x-36-1100-lb-Triple-Wall-Box-Kit',uname:'36 × 36 × 36 in 1,100 lb Triple-Wall Box Kit',spec:{Material:'Heavy corrugated',Construction:'Triple-wall',Rating:'1,100 lb test',Weight:'Approx. 24 lb each',Condition:'Good reusable',Pickup:'7 business days'}},{id:'tubes',cat:'tubes',icon:'🧻',title:'2,200 Heavy-Duty Mailing Tubes',sub:'3 × 36 in · Kraft with end caps',qty:2200,unit:'tubes',cur:1450,buy:4400,uv:3.05,nv:6710,bids:22,unique:13,watch:184,end:N+7*H+26*6e4,loc:'Elkhart, IN',uline:'https://www.uline.com/Product/Detail/S-14049/Kraft-Mailing-Tubes/Kraft-Mailing-Tubes-with-End-Caps-3-x-36-125-thick',uname:'3 × 36 in Kraft Mailing Tubes with End Caps',spec:{Material:'Spiral-wound kraft',Size:'3 in ID × 36 in usable',Wall:'Approx. .080 in',Caps:'Two included per tube',Condition:'New surplus',Pickup:'4 business days'}},{id:'foam',cat:'foam',icon:'⬜',title:'96 Soft Foam Sheets',sub:'48 × 96 × 1 in · White',qty:96,unit:'sheets',cur:1180,buy:2400,uv:47,nv:4512,bids:14,unique:9,watch:71,end:N+9*H+18*6e4,loc:'Elkhart, IN',uline:'https://www.uline.com/Product/Detail/S-12836/Foam/Uline-Soft-Foam-Sheets-White-1-thick-48-x-96',uname:'48 × 96 × 1 in Soft Foam Sheets',spec:{Material:'Polyurethane foam',Size:'48 × 96 × 1 in',Density:'Medium-soft packaging grade',Color:'White',Condition:'Clean surplus',Pickup:'4 business days'}},{id:'rolls',cat:'foam',icon:'🧻',title:'36 Polyethylene Foam Rolls',sub:'24 in × 550 ft × 1/8 in',qty:36,unit:'rolls',cur:1120,buy:2200,uv:83,nv:2988,bids:10,unique:7,watch:59,end:N+3*D+15*H,loc:'Goshen, IN',uline:'https://www.uline.com/BL_864/Foam-Rolls',uname:'Comparable Polyethylene Foam Rolls',spec:{Material:'Polyethylene foam',Width:'24 in',Length:'550 ft',Thickness:'1/8 in',Condition:'New surplus',Pickup:'5 business days'}},{id:'pallets',cat:'pallets',icon:'🪵',title:'120 Standard Wood Pallets',sub:'48 × 40 in · Grade A/B mix',qty:120,unit:'pallets',cur:1260,buy:2300,uv:27,nv:3240,bids:19,unique:12,watch:88,end:N+18*H+9*6e4,loc:'Elkhart, IN',uline:'https://www.uline.com/Product/Detail/H-750/Pallets/Recycled-Wood-Pallet-48-x-40',uname:'48 × 40 in Recycled Wood Pallets',spec:{Material:'Recycled hardwood',Size:'48 × 40 in',Entry:'Four-way',Grade:'A/B mix',Loading:'Forklift included',Pickup:'3 business days'}},{id:'closed',cat:'closed',icon:'🏆',title:'180 Heavy-Duty Gaylord Boxes',sub:'48 × 40 × 36 in · Auction closed',qty:180,unit:'boxes',cur:2475,buy:0,uv:53,nv:9540,bids:24,unique:16,watch:219,end:N-H,closed:true,winner:'Summit Components LLC',loc:'Elkhart, IN',uline:'https://www.uline.com/BL_437/Gaylord-Boxes',uname:'Comparable Heavy-Duty Gaylord Boxes',spec:{Material:'Heavy corrugated',Style:'Gaylord / bulk cargo',Size:'48 × 40 × 36 in',Condition:'Good reusable',Result:'Paid and pickup scheduled',Pickup:'July 20, 2026'}}];const qa={boxes:[['How much does each box weigh?','Samples average about 3.0 lb each for the featured double-wall lot. Full-lot weight is estimated before pallets.'],['What cardboard and flute are used?','Kraft corrugated with B/C flute for the double-wall lot. Each listing shows its own construction.'],['What is the crush capacity?','The comparable benchmark is 275 lb test. Buyers should validate stacking performance for their exact product.'],['Are there logos printed on them?','Most are plain kraft; a small portion have one-color markings on one side.'],['Can you load a 53-foot dry van?','Yes. Forklift and dock loading are available by appointment after payment.']],foam:[['What density is the foam?','Medium-density packaging foam. Buyers may inspect and test before bidding.'],['Is it clean enough for upholstery?','It is clean industrial surplus with no oil saturation, but is not certified for medical or food contact.'],['Can it be compressed for pickup?','Some an>🏢 ${l.unique} bidders</span></div><div class="reserve">✓ Reserve met · Uline benchmark linked</div></div></article>`}function home(){location.hash='';document.title='BulkBid Marketplace Demo';app.innerHTML=`<div class="w"><section class="hero"><b>Industrial surplus, priced to move</b><h1>Bid on bulk goods.<br><span>Pay far less.</span></h1><p>Buy warehouse quantities of boxes, tubes, pallets and foam before they enter the recycling stream.</p></section><div class="stats"><div class="stat"><b>1,342</b>registered buyers</div><div class="stat"><b>$184K</b>retail value listed</div><div class="stat"><b>73%</b>average savings</div><div class="stat"><b>4.9 ★</b>seller rating</div></div></div><section class="section w"><div class="head"><div><h2>Surplus auctions</h2><div class="muted">Click any lot for a full auction page.</div></div><div class="filters">${['all','boxes','foam','tubes','pallets','closed'].map(x=>`<button class="filter ${cat===x?'active':''}" data-cat="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div></div><div class="search"><input id="search" placeholder="Search by size, material or lot"><select id="sort"><option value="end">Ending soonest</option><option value="low">Lowest bid</option><option value="save">Best savings</option></select></div><div class="grid" id="grid"></div></section><section class="section w"><div class="head"><div><h2>Marketplace activity</h2><div class="muted">A realistic preview of buyer and seller activity.</div></div></div><div class="market"><div class="panel"><h3>Recently sold</h3><div class="activity"><div class="icon">🏆</div><div><b>180 Gaylord boxes · $2,475</b><div class="muted">Summit Components LLC · 24 bids</div></div></div><div class="activity"><div class="icon">📦</div><div><b>3,200 appliance cartons · $3,850</b><div class="muted">Northern Distribution · 31 bids</div></div></div><div class="activity"><div class="icon">⬜</div><div><b>140 foam sheets · $1,925</b><div class="muted">Custom Cushion Co. · 17 bids</div></div></div></div><div class="panel"><h3>Buyer dashboard</h3><div class="activity"><div class="icon">👀</div><div><b>6 watched auctions</b><div class="muted">Two close in under 12 hours</div></div></div><div class="activity"><div class="icon">🔔</div><div><b>3 saved searches</b><div class="muted">Boxes · foam rolls · mailing tubes</div></div></div><div class="activity"><div class="icon">💬</div><div><b>4 seller answers received</b><div class="muted">Newest answer 7 minutes ago</div></div></div></div></div></section>`;document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;home()});search.oninput=draw;document.getElementById('sort').value=sort;document.getElementById('sort').onchange=e=>{sort=e.target.value;draw()};draw()}function draw(){let q=(search.value||'').toLowerCase(),a=lots.filter(l=>(cat==='all'||l.cat===cat)&&(`${l.title} ${l.sub} ${Object.values(l.spec).join(' ')}`.toLowerCase().includes(q)));a.sort((x,y)=>sort==='low'?x.cur-y.cur:sort==='save'?save(y)-save(x):(x.closed?1e20:x.end)-(y.closed?1e20:y.end));grid.innerHTML=a.map(card).join('');document.querySelectorAll('.card').forEach(c=>c.onclick=()=>location.hash='lot/'+c.dataset.id)}function detail(id){let l=lots.find(x=>x.id===id);if(!l)return home();let qs=qa[l.cat]||qa.boxes;document.title=l.title+' · BulkBid';app.innerHTML=`<main class="detail w"><div class="crumb"><button class="ghost" id="back">← All auctions</button> · ${l.cat} · ${l.id.toUpperCase()}</div><div class="two"><section class="gallery"><div class="mainart">${l.icon}</div><div class="social"><span>📐 Dimensions verified</span><span>🏭 Warehouse photos</span><span>🚚 Loading available</span></div></section><aside class="side"><span class="filter">${l.cat.toUpperCase()}</span><h1>${l.title}</h1><div class="muted">${l.sub}<br>Pickup: ${l.loc}</div><div class="seller"><div class="sellerleft"><div class="avatar">TP</div><div><b>Tri-Power Recycling</b><div class="muted">4.9 ★ · 64 completed sales</div></div></div><span class="verified">Verified seller</span></div><div class="social"><span>🟢 ${l.watch} watching now</span><span>🔥 ${l.bids} bids</span><span>🏢 ${l.unique} unique bidders</span></div><div class="clock"><small>${l.closed?'Auction result':'Time remaining'}</small><b id="clock">${l.closed?'Closed':fmt(l.end-Date.now())}</b></div><div class="metrics"><div class="metric"><small>${l.closed?'Winning bid':'Current bid'}</small><b id="cur">${money(l.cur)}</b></div><div class="metric"><small>Comparable new</small><b><s>${money(l.nv)}</s></b></div><div class="metric"><small>Total bids</small><b>${l.bids}</b></div><div class="metric"><small>Current savings</small><b>${save(l)}%</b></div></div>${l.closed?`<div class="save"><b>🏆 ${l.winner}</b>Payment confirmed and pickup scheduled.</div>`:`<div class="bidrow"><input id="bid" type="number" value="${l.cur+25}"><button class="btn" id="place">Place bid</button></div><button class="ghost wide" id="buy">Buy It Now — ${money(l.buy)}</button><button class="ghost wide watch" id="watch">☆ Watch this auction</button><div class="reserve">✓ Reserve met · Buy It Now set by seller</div>`}</aside></div><div class="two below"><section class="panel"><h2>Lot details</h2><div class="specs">${Object.entries(l.spec).map(([k,v])=>`<div class="spec"><small>${k}</small><b>${v}</b></div>`).join('')}<div class="spec"><small>Quantity</small><b>${l.qty.toLocaleString()} ${l.unit}</b></div><div class="spec"><small>Loading</small><b>Forklift assistance available</b></div></div></section><section class="panel"><h2>Bid history</h2>${[['Midwest Packaging',l.cur,'42 seconds ago'],['A***n Industrial',Math.max(25,l.cur-75),'18 minutes ago'],['Warehouse Direct',Math.max(25,l.cur-160),'Yesterday']].map(x=>`<div class="hist"><span><b>${x[0]}</b><br><span class="muted">${x[2]}</span></span><b>${money(x[1])}</b></div>`).join('')}</section></div><section class="uline"><div class="ulinebrand">ULINE</div><h2>New retail benchmark</h2><div class="muted">Comparable product: ${l.uname}. Specifications may vary; this provides a familiar replacement-cost benchmark.</div><div class="save">Estimated savings at current bid<b>${money(l.nv-l.cur)} · ${save(l)}% less</b></div><div class="unit"><div><small>Comparable Uline</small><b>${money(l.uv)} / ${l.unit.slice(0,-1)||'unit'}</b></div><div><small>Current BulkBid</small><b>${money(l.cur/l.qty)} / ${l.unit.slice(0,-1)||'unit'}</b></div><div><small>Comparable total</small><b>${money(l.nv)}</b></div></div><a href="${l.uline}" target="_blank" rel="noopener">View comparable product on Uline.com ↗</a></section><section class="qa"><div class="head"><div><h2>Questions & answers</h2><div class="muted">Ask Tri-Power or learn from verified business buyers.</div></div><span class="verified">${qs.length} answered</span></div><div class="ask"><input id="question" placeholder="Ask about weight, crush rating, material or pickup"><button class="btn" id="ask">Ask question</button></div><div id="qalist">${qs.map((x,i)=>`<div class="q"><div class="qtitle">Q: ${x[0]}</div><div class="muted">Asked by verified business buyer · ${i+1} days ago</div><div class="answer"><span class="verified">✓ Verified answer</span><br><b>Tri-Power Recycling</b><br>${x[1]}<br><button class="help">👍 Helpful · <span>${18+i*5}</span></button></div></div>`).join('')}</div></section><section class="section"><h2>Similar lots</h2><div class="grid">${lots.filter(x=>x.id!==l.id&&x.cat===l.cat).slice(0,3).map(card).join('')}</div></section></main>`;back.onclick=home;document.querySelectorAll('.card').forEach(c=>c.onclick=()=>location.hash='lot/'+c.dataset.id);if(!l.closed){place.onclick=()=>{let v=+bid.value;if(v<=l.cur)return pop('Bid must exceed current bid.');l.cur=v;l.bids++;pop('Demo bid accepted — you are the high bidder.');detail(l.id)};buy.onclick=()=>pop('Demo checkout opened for '+money(l.buy));watch.onclick=e=>{e.currentTarget.classList.toggle('on');e.currentTarget.textContent=e.currentTarget.classList.contains('on')?'★ Watching — alerts enabled':'☆ Watch this auction';pop('Watchlist updated.')}}ask.onclick=()=>{if(!question.value.trim())return pop('Enter a question first.');qalist.insertAdjacentHTML('afterbegin',`<div class="q"><div class="qtitle">Q: ${question.value.replace(/</g,'&lt;')}</div><div class="muted">Asked by You · Just now</div><div class="answer"><b>Seller response pending</b><br>Tri-Power was notified through Telegram.</div></div>`);question.value='';pop('Question posted and seller notified.')};document.querySelectorAll('.help').forEach(b=>b.onclick=()=>{let s=b.querySelector('span');s.textContent=+s.textContent+1;pop('Marked helpful.')})}function route(){let m=location.hash.match(/^#lot\/(.+)$/);m?detail(m[1]):home()}logo.onclick=home;browse.onclick=home;alert.onclick=()=>pop('Buyer alert created for boxes, foam and tubes.');addEventListener('hashchange',route);setInterval(()=>{let m=location.hash.match(/^#lot\/(.+)$/),l=m&&lots.find(x=>x.id===m[1]),c=document.getElementById('clock');if(c&&l&&!l.closed)c.textContent=fmt(l.end-Date.now())},1000);route();</script></body></html>
