.detailsbelow{display:grid;grid-template-columns:1.3fr .7fr;gap:24px;margin-top:24px}.specs,.history{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px}.specgrid{display:grid;grid-template-columns:1fr 1fr;gap:0}.spec{padding:13px 0;border-bottom:1px solid var(--line)}.spec:nth-child(odd){padding-right:18px}.spec small{display:block;color:var(--muted)}.historyrow{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}.historyrow:last-child{border-bottom:0}
.related{margin-top:32px}.related h2{font-size:28px}
.toast{position:fixed;right:18px;bottom:18px;background:var(--dark);color:#fff;border-radius:12px;padding:14px 16px;display:none;z-index:20;max-width:330px}.toast.show{display:block}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.open{display:flex}.modalbox{background:#fff;border-radius:18px;padding:24px;width:min(430px,100%)}.modalbox input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;margin:12px 0}.row{display:flex;gap:10px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:repeat(2,1fr)}.telegram,.detailgrid,.detailsbelow{grid-template-columns:1fr}.mainart{height:320px}.searchbar{grid-template-columns:1fr}}
@media(max-width:590px){.hero{padding:34px 23px}.grid{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}.section{padding:38px 0}.navlinks .ghost{display:none}.side h1{font-size:29px}.mainart{height:255px;font-size:105px}.specgrid{grid-template-columns:1fr}.spec:nth-child(odd){padding-right:0}.metricrow{grid-template-columns:1fr 1fr}.thumbs{grid-template-columns:repeat(4,1fr)}}
</style>

let selectedCat='all',selectedSort='ending',chosen=null;
const money=n=>'$'+Number(n).toLocaleString();
const fmtTime=ms=>{if(ms<=0)return'Closed';const d=Math.floor(ms/D),h=Math.floor(ms%D/H),m=Math.floor(ms%H/60000),sec=Math.floor(ms%60000/1000);return String(d).padStart(2,'0')+'d '+String(h).padStart(2,'0')+'h '+String(m).padStart(2,'0')+'m '+String(sec).padStart(2,'0')+'s'}
function savings(l){return Math.max(0,Math.round((1-l.current/l.newValue)*100))}
function badge(l){if(l.closed)return'<span class="badge closed">Closed · Winner selected</span>';const left=l.end-Date.now();if(left<12*H)return'<span class="badge ending">Ending soon</span>';return'<span class="badge">Live auction</span>'}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function home(){location.hash='';renderHome()}
function card(l){return `<article class="lot" data-id="${l.id}"><div class="art">${badge(l)}${l.icon}</div><div class="body"><h3>${l.title}</h3><div class="meta">${l.subtitle}<br>${l.location} · ${l.closed?'Closed': 'Ends in '+fmtTime(l.end-Date.now())}</div><div class="compare"><div>Comparable new<strong><s>${money(l.newValue)}</s></strong></div><div>${l.closed?'Final savings':'Current savings'}<strong>${savings(l)}%</strong></div></div><div class="price"><div><span class="meta">${l.closed?'Winning bid':'Current bid'}</span><br><b>${money(l.current)}</b></div><button class="bid">${l.closed?'View result':'View auction'}</button></div>${l.closed?`<div class="closednote">Won by ${l.winner}</div>`:'<div class="reserve">✓ Reserve met</div>'}</div></article>`}
function renderHome(){document.title='BulkBid Demo';app.innerHTML=`<div class="wrap"><section class="hero"><span class="eyebrow">Industrial surplus, priced to move</span><h1>Bid on bulk goods.<br><span>Pay far less.</span></h1><p>Buy warehouse quantities of boxes, tubes, pallets, foam and packaging materials before they enter the recycling stream.</p><div class="stats"><div><b>${lots.filter(l=>!l.closed).length} live lots</b>across four categories</div><div><b>Pickup only</b>simple logistics</div><div><b>Reserve protected</b>never below scrap value</div></div></section></div><main><section class="section wrap" id="lots"><div class="head"><div><h2>Surplus auctions</h2><p>Click any lot to open a full product detail page.</p></div><div class="filters"><button class="filter" data-cat="all">All</button><button class="filter" data-cat="boxes">Boxes</button><button class="filter" data-cat="foam">Foam</button><button class="filter" data-cat="tubes">Tubes</button><button class="filter" data-cat="pallets">Pallets</button><button class="filter" data-cat="closed">Closed</button></div></div><div class="searchbar"><input id="search" placeholder="Search by size, material, quantity or lot number"><select id="sort"><option value="ending">Ending soonest</option><option value="price-low">Lowest current bid</option><option value="price-high">Highest current bid</option><option value="savings">Best savings</option></select></div><div class="grid" id="grid"></div></section><section class="section wrap"><div class="panel"><div class="head"><div><h2>Simple by design</h2><p>If bidding does not clear the reserve, the material is recycled normally.</p></div></div><div class="steps"><div><div class="num">1</div><h3>Surplus arrives</h3><p>Reusable material is sorted into consistent lots.</p></div><div><div class="num">2</div><h3>Timed auction</h3><p>Each listing has its own closing date and reserve.</p></div><div><div class="num">3</div><h3>Buyer pays</h3><p>The highest qualified bidder owns the entire lot.</p></div><div><div class="num">4</div><h3>Local pickup</h3><p>The buyer schedules pickup and removes the inventory.</p></div></div></div></section><section class="section wrap"><div class="telegram"><div class="copy"><span class="eyebrow">Telegram-powered listing</span><h2>Talk to your bot. The lot goes live.</h2><p>Describe the material, upload photos, state the reserve and auction length, then approve the generated listing.</p></div><div class="chat"><div class="bubble mine">Create a lot: 2,200 tubes, 3×36, spiral-wound kraft, reserve $900, auction ends tomorrow at 6 PM.</div><div class="bubble"><b>BulkBid Bot</b><br>Draft created. Comparable new value: $7,040. Suggested buy now: $2,050.</div><div class="bubble mine">Publish it.</div><div class="bubble"><b>BulkBid Bot</b><br>Auction published and 37 matching buyer alerts sent.</div></div></div></section></main>`;document.querySelectorAll('[data-cat]').forEach(b=>{if(b.dataset.cat===selectedCat)b.classList.add('active');b.addEventListener('click',()=>{selectedCat=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));renderGrid()})});document.getElementById('search').addEventListener('input',renderGrid);document.getElementById('sort').value=selectedSort;document.getElementById('sort').addEventListener('change',e=>{selectedSort=e.target.value;renderGrid()});renderGrid()}
function renderGrid(){const q=(document.getElementById('search')?.value||'').toLowerCase();let arr=lots.filter(l=>(selectedCat==='all'||(selectedCat==='closed'?l.closed:l.cat===selectedCat))&&(`${l.title} ${l.subtitle} ${l.qty} ${l.lot} ${Object.values(l.specs).join(' ')}`.toLowerCase().includes(q)));arr.sort((a,b)=>selectedSort==='price-low'?a.current-b.current:selectedSort==='price-high'?b.current-a.current:selectedSort==='savings'?savings(b)-savings(a):(a.closed?Infinity:a.end)-(b.closed?Infinity:b.end));grid.innerHTML=arr.map(card).join('')||'<div class="panel">No matching lots found.</div>';document.querySelectorAll('.lot').forEach(el=>el.addEventListener('click',()=>location.hash='lot/'+el.dataset.id))}
function watchers(l){return Math.max(9,l.bids*4+(l.id.length%17))}
function buyNowPrice(l){return l.buyNow?Math.max(l.buyNow,Math.ceil(l.current*2.15/50)*50):null}
function qaFor(l){const common=[['Does the lot have to be purchased all at once?','Yes. Each BulkBid auction is for the complete listed quantity. We are not splitting this lot.','BulkBid Seller Team','12'],['Can you load this onto our trailer?','Forklift loading assistance is available during the scheduled pickup window. The buyer should arrive with suitable equipment and securement.','Tri-Power Recycling','8']];const byCat={boxes:[['Approximately how much does each box weigh?','About 1.3–1.8 lb each depending on the exact board and moisture content. We can weigh a sample before pickup if needed.','Tri-Power Recycling','19'],['What cardboard and crush rating are these?',`These are ${l.specs['Wall type']||'corrugated'} kraft cartons. The listed board rating is ${l.specs['Board rating']||'available by sample verification'}. We recommend buyers verify suitability for unusually heavy contents.`,'BulkBid Seller Team','24'],['Are there logos or printing on the boxes?','Most are unprinted or have minimal previous markings. The photos and condition notes show the representative lot; buyers may inspect before bidding.','Tri-Power Recycling','11']],foam:[['What density is the foam?',`The listed density is ${l.specs['Density']||'medium density; exact lab certification is not available'}. A physical sample can be inspected before bidding.`,'Tri-Power Recycling','16'],['Is the foam clean enough for upholstery or packaging?','Yes, this lot was separated as clean reusable material. It may have minor handling dust but no known oil or chemical contamination.','BulkBid Seller Team','13'],['Can the foam be compressed for transport?','Some foam can be compressed, but EPS blocks cannot. Trailer volume should be planned using the listed dimensions.','Tri-Power Recycling','9']],tubes:[['Are caps included with the tubes?',l.specs['Caps']?`Yes. ${l.specs['Caps']}.`:'Caps are not guaranteed unless specifically listed in the lot details.','Tri-Power Recycling','18'],['What is the wall thickness and crush strength?',`The listed wall thickness is ${l.specs['Wall thickness']||'not yet measured'}. Formal crush-test certification is not included, but buyers can inspect and test a sample before closing.`,'BulkBid Seller Team','21'],['Are all tubes the exact same length?','They were sorted as a uniform lot. Normal manufacturing tolerance and a small number of outliers may exist.','Tri-Power Recycling','10']],pallets:[['Are all pallets structurally usable?','The lot is represented by the stated grade mix. Broken or unsafe pallets were removed, though normal used-pallet wear should be expected.','Tri-Power Recycling','17'],['Are they heat treated and stamped?','Only lots specifically described as heat treated should be assumed to have current visible HT stamps.','BulkBid Seller Team','14']]};return [...(byCat[l.cat]||[]),...common]}
function renderDetail(id){const l=lots.find(x=>x.id===id);if(!l)return home();document.title=l.title+' · BulkBid';const related=lots.filter(x=>x.id!==l.id&&x.cat===l.cat).slice(0,3);app.innerHTML=`<main class="wrap detail"><div class="crumb"><button id="backHome">Auctions</button><span>›</span><span>${l.cat[0].toUpperCase()+l.cat.slice(1)}</span><span>›</span><span>${l.lot}</span></div><div class="detailgrid"><section class="gallery"><div class="mainart">${l.icon}</div><div class="thumbs"><div class="thumb active">${l.icon}</div><div class="thumb">📐</div><div class="thumb">🏭</div><div class="thumb">🚚</div></div></section><aside class="side"><span class="filter">${l.cat.toUpperCase()}</span><h1>${l.title}</h1><p class="meta">${l.subtitle}<br>Lot ${l.lot} · Pickup in ${l.location}</p><div class="timebox"><small>${l.closed?'Auction status':'Time remaining'}</small><div class="count" id="detailCount">${l.closed?'Closed':fmtTime(l.end-Date.now())}</div><small>${l.closed?'Closed with '+l.bids+' total bids':'Days · hours · minutes · seconds'}</small></div><div class="socialproof"><span class="proof">👁 ${watchers(l)} watching</span><span class="proof">🔥 ${l.bids} bids</span><span class="proof">📍 ${l.location}</span></div><div class="metricrow"><div class="metric"><small>${l.closed?'Winning bid':'Current bid'}</small><b id="detailPrice">${money(l.current)}</b></div><div class="metric"><small>Comparable new</small><b><s>${money(l.newValue)}</s></b></div><div class="metric"><small>Total bids</small><b>${l.bids}</b></div><div class="metric"><small>${l.closed?'Final savings':'Current savings'}</small><b>${savings(l)}%</b></div></div>${l.closed?`<div class="winner">🏆 Winning bidder: ${l.winner}<br><span class="meta">Pickup scheduled and payment confirmed.</span></div>`:`<div class="bidbox"><input id="detailBid" type="number" value="${l.current+25}"><button class="btn" id="detailBidBtn">Place bid</button></div><button class="buy" id="buyBtn">Buy it now for ${money(buyNowPrice(l))}</button><div class="reserve">✓ Seller-set Buy It Now price · Reserve met · Highest qualified bid wins</div>`}</aside></div><div class="detailsbelow"><section class="specs"><h2>Lot details</h2><p class="meta">Entire lot sold as one unit. Buyer is responsible for pickup, loading coordination and removal within the stated window.</p><div class="specgrid">${Object.entries(l.specs).map(([k,v])=>`<div class="spec"><small>${k}</small><strong>${v}</strong></div>`).join('')}<div class="spec"><small>Quantity</small><strong>${l.qty}</strong></div><div class="spec"><small>Condition</small><strong>${l.condition}</strong></div></div></section><section class="history"><h2>Bid history</h2>${l.history.map(r=>`<div class="historyrow"><div><strong>${r[0]}</strong><br><span class="meta">${r[2]}</span></div><strong>${r[1]}</strong></div>`).join('')}</section></div><section class="qa"><h2>Questions & answers</h2><p class="meta">Ask the seller about dimensions, material, weight, crush capacity, loading or pickup.</p><div class="askrow"><input id="qaInput" placeholder="Ask a question about this lot"><button class="btn" id="qaAsk">Ask seller</button></div><div id="qaList">${qaFor(l).map((q,i)=>`<div class="qaitem"><div class="qhead"><div class="qtext">${q[0]}</div><span class="meta">${i+2} days ago</span></div><div class="answer"><span class="seller">✓ ${q[2]} · Verified seller</span><br>${q[1]}<div class="helpful">👍 ${q[3]} people found this helpful</div></div></div>`).join('')}</div></section><section class="related"><h2>More ${l.cat}</h2><div class="grid">${related.map(card).join('')}</div></section></main>`;document.getElementById('backHome').addEventListener('click',home);document.querySelectorAll('.lot').forEach(el=>el.addEventListener('click',()=>location.hash='lot/'+el.dataset.id));document.getElementById('qaAsk').addEventListener('click',()=>{const input=document.getElementById('qaInput');if(!input.value.trim()){toast('Type a question first.');return}const div=document.createElement('div');div.className='qaitem';div.innerHTML=`<div class="qhead"><div class="qtext">${input.value.replace(/</g,'&lt;')}</div><span class="meta">Just now</span></div><div class="answer"><span class="seller">Awaiting seller response</span><br>Your question has been submitted to the seller.</div>`;document.getElementById('qaList').prepend(div);input.value='';toast('Question submitted to the seller.')});if(!l.closed){document.getElementById('detailBidBtn').addEventListener('click',()=>placeDetailBid(l));document.getElementById('buyBtn').addEventListener('click',()=>toast('Demo only: Buy It Now checkout would open here.'))}}
function placeDetailBid(l){const v=+document.getElementById('detailBid').value;if(v<=l.current){toast('Your bid must be higher than the current bid.');return}l.current=v;l.bids++;l.history.unshift(['You',money(v),'Just now']);document.getElementById('detailPrice').textContent=money(v);toast('Demo bid accepted. You are the high bidder.');renderDetail(l.id)}
function route(){const m=location.hash.match(/^#lot\/(.+)$/);m?renderDetail(m[1]):renderHome()}
document.getElementById('homeLogo').addEventListener('click',home);document.getElementById('browseBtn').addEventListener('click',home);document.getElementById('alertsBtn').addEventListener('click',()=>toast('Buyer alert demo: saved for boxes, foam and tubes.'));window.addEventListener('hashchange',route);setInterval(()=>{if(location.hash.startsWith('#lot/')){const id=location.hash.split('/')[1],l=lots.find(x=>x.id===id),el=document.getElementById('detailCount');if(el&&l&&!l.closed)el.textContent=fmtTime(l.end-Date.now())}},1000);route();
</script>
</body></html>
