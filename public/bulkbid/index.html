<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BulkBid Demo</title><style>:root{--d:#0b1220;--l:#d9ff57;--p:#f5f6f2;--m:#667085;--b:#e4e7ec;--g:#137a4b;--r:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--p);color:#111827}button,input,select{font:inherit}a{text-decoration:none;color:inherit}.wrap{width:min(1160px,calc(100% - 28px));margin:auto}.top{background:var(--d);color:#fff;text-align:center;padding:9px;font-size:13px}.nav{display:flex;justify-content:space-between;align-items:center;padding:17px 0;gap:14px}.logo{font-weight:900;font-size:25px;display:flex;gap:9px;align-items:center;cursor:pointer}.mark{background:var(--l);color:var(--d);width:38px;height:38px;border-radius:10px;display:grid;place-items:center}.navlinks{display:flex;gap:8px}.btn,.bid,.ghost{border:0;border-radius:11px;padding:11px 15px;font-weight:900;cursor:pointer}.btn,.bid{background:var(--l);color:var(--d)}.ghost{background:#fff;border:1px solid var(--b)}.hero{background:linear-gradient(135deg,#0b1220,#21324c);color:#fff;border-radius:25px;padding:52px}.hero h1{font-size:clamp(42px,7.5vw,74px);line-height:.96;letter-spacing:-.055em;margin:18px 0}.hero h1 span{color:var(--l)}.hero p{font-size:19px;color:#cbd5e1;line-height:1.55;max-width:760px}.eyebrow{display:inline-block;border:1px solid #46546a;border-radius:999px;padding:8px 12px;font-size:13px}.stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:28px}.stats b{display:block;font-size:22px}.section{padding:48px 0}.head{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:20px}.head h2{font-size:36px;margin:0;letter-spacing:-.04em}.head p,.meta{color:var(--m)}.filters{display:flex;gap:7px;flex-wrap:wrap}.filter{border:1px solid var(--b);background:#fff;border-radius:999px;padding:9px 13px;font-weight:800;cursor:pointer}.filter.active{background:var(--d);color:#fff}.searchbar{display:grid;grid-template-columns:1fr 190px;gap:10px;margin-bottom:18px}.searchbar input,.searchbar select{width:100%;padding:13px;border:1px solid var(--b);border-radius:12px;background:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.lot{background:#fff;border:1px solid var(--b);border-radius:18px;overflow:hidden;cursor:pointer;transition:.18s}.lot:hover{transform:translateY(-3px);box-shadow:0 14px 32px #0b122012}.art{height:166px;display:grid;place-items:center;font-size:68px;background:linear-gradient(135deg,#eef1ea,#dde4d7);position:relative}.badge{position:absolute;top:12px;left:12px;background:#fff;border:1px solid var(--b);padding:7px 9px;border-radius:999px;font-size:11px;font-weight:900}.badge.closed{background:#111827;color:#fff}.badge.ending{background:#fff1e6;color:#9a3412}.body{padding:17px}.body h3{margin:0 0 7px;font-size:19px}.meta{font-size:13px;line-height:1.5}.compare{display:flex;justify-content:space-between;background:#f6f8f3;border-radius:11px;padding:11px;margin:13px 0;font-size:12px}.compare strong{display:block;font-size:15px;color:#111827}.price{display:flex;justify-content:space-between;align-items:end}.price b{font-size:25px}.reserve{margin-top:8px;font-size:11px;color:var(--g);font-weight:800}.closednote{margin-top:8px;font-size:12px;color:var(--r);font-weight:800}.panel{background:#fff;border:1px solid var(--b);border-radius:23px;padding:30px}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.num{width:40px;height:40px;border-radius:11px;background:var(--l);display:grid;place-items:center;font-weight:900}.steps p{color:var(--m);font-size:14px;line-height:1.5}.telegram{display:grid;grid-template-columns:1fr 1fr;background:var(--d);color:#fff;border-radius:23px;overflow:hidden}.copy{padding:38px}.copy h2{font-size:37px}.copy p{color:#cbd5e1;line-height:1.55}.chat{background:#dfe8ee;padding:24px;display:flex;flex-direction:column;gap:10px}.bubble{background:#fff;color:#111827;border-radius:14px;padding:12px;font-size:13px;line-height:1.45;max-width:90%}.mine{background:#d9ffc7;margin-left:auto}.foot{padding:36px 0 55px;border-top:1px solid var(--b);color:var(--m);font-size:13px}.detail{padding:18px 0 58px}.crumb{display:flex;gap:8px;color:var(--m);font-size:13px;margin:8px 0 18px}.crumb button{border:0;background:none;color:inherit;cursor:pointer;padding:0}.detailgrid{display:grid;grid-template-columns:1.15fr .85fr;gap:24px}.gallery,.side,.specs,.history{background:#fff;border:1px solid var(--b);border-radius:22px;padding:18px}.mainart{height:390px;border-radius:17px;background:linear-gradient(135deg,#e9ede5,#dce4d8);display:grid;place-items:center;font-size:145px}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:10px}.thumb{height:78px;border-radius:12px;background:#eef1ea;display:grid;place-items:center;font-size:34px;border:2px solid transparent}.thumb.active{border-color:var(--d)}.side{padding:24px}.side h1{font-size:34px;line-height:1.03;letter-spacing:-.04em}.timebox{background:var(--d);color:#fff;border-radius:16px;padding:16px;margin:18px 0}.timebox small{color:#cbd5e1}.count{font-size:28px;font-weight:900}.metricrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}.metric{background:#f7f8f5;border-radius:13px;padding:13px}.metric small{color:var(--m);display:block}.metric b{font-size:21px}.bidbox{display:grid;grid-template-columns:1fr auto;gap:9px}.bidbox input{padding:13px;border:1px solid var(--b);border-radius:11px;min-width:0}.buy{width:100%;margin-top:9px;background:#fff;border:1px solid var(--d);border-radius:11px;padding:12px;font-weight:900;cursor:pointer}.winner{background:#ecfdf3;color:#166534;border-radius:13px;padding:14px;font-weight:800}.detailsbelow{display:grid;grid-template-columns:1.3fr .7fr;gap:24px;margin-top:24px}.specgrid{display:grid;grid-template-columns:1fr 1fr}.spec{padding:13px 0;border-bottom:1px solid var(--b)}.spec small{display:block;color:var(--m)}.historyrow{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--b);font-size:14px}.related{margin-top:32px}.toast{position:fixed;right:18px;bottom:18px;background:var(--d);color:#fff;border-radius:12px;padding:14px 16px;display:none;z-index:20}.toast.show{display:block}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.steps{grid-template-columns:repeat(2,1fr)}.telegram,.detailgrid,.detailsbelow{grid-template-columns:1fr}.searchbar{grid-template-columns:1fr}}@media(max-width:590px){.hero{padding:34px 23px}.grid,.steps{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}.navlinks .ghost{display:none}.side h1{font-size:29px}.mainart{height:255px;font-size:105px}.specgrid{grid-template-columns:1fr}}</style></head><body><div class="top">Local pickup marketplace · Elkhart County, Indiana</div><div class="wrap"><nav class="nav"><div class="logo" id="homeLogo"><span class="mark">BB</span>BulkBid</div><div class="navlinks"><button class="ghost" id="alertsBtn">Create buyer alert</button><button class="btn" id="browseBtn">Browse auctions</button></div></nav></div><div id="app"></div><footer class="wrap foot">BulkBid proof of concept · Industrial surplus gets a second life · Comparable-new values are illustrative and should be verified before launch.</footer><div class="toast" id="toast"></div><script>const N=Date.now(),H=36e5,D=864e5;const lots=[{id:'boxes-1850',cat:'boxes',icon:'📦',title:'1,850 Double-Wall Shipping Boxes',sub:'18 × 18 × 12 in · Excellent condition',qty:'1,850 boxes',cond:'Once-used',cur:940,nv:5975,bids:11,end:N+D+8*H,buy:1450,loc:'Elkhart, Indiana',lot:'BB-1042',spec:{Material:'Corrugated kraft','Wall type':'Double-wall','Board rating':'48 ECT','Inside dimensions':'18 × 18 × 12 in','Pickup window':'5 business days'},hist:[['Midwest Fulfillment','$940','Today 3:18 PM'],['A***n Packaging','$890','Today 1:04 PM']]},{id:'cartons-5000',cat:'boxes',icon:'📦',title:'5,000 Lightweight Cartons',sub:'16 × 12 × 12 in · New surplus',qty:'5,000 boxes',cond:'New surplus',cur:1680,nv:6300,bids:18,end:N+3*H+42*6e4,buy:2350,loc:'Bristol, Indiana',lot:'BB-1043',spec:{Material:'Kraft corrugated','Wall type':'Single-wall','Board rating':'32 ECT','Inside dimensions':'16 × 12 × 12 in','Pickup window':'3 business days'},hist:[['Hoosier Ecom','$1,680','Today 4:51 PM'],['BoxRunner','$1,610','Today 4:04 PM']]},{id:'triple-wall',cat:'boxes',icon:'🧱',title:'600 Triple-Wall Bulk Boxes',sub:'36 × 36 × 36 in · Heavy-duty',qty:'600 boxes',cond:'Good',cur:7200,nv:36600,bids:7,end:N+4*D+11*H,buy:9800,loc:'Elkhart, Indiana',lot:'BB-1044',spec:{Material:'Heavy corrugated','Wall type':'Triple-wall','Board rating':'1100#','Inside dimensions':'36 × 36 × 36 in','Pickup window':'7 business days'},hist:[['Great Lakes Parts','$7,200','Yesterday 11:31 AM'],['RV Supply Co.','$6,800','Yesterday 10:02 AM']]},{id:'long-boxes',cat:'boxes',icon:'📏',title:'900 Long Narrow Cartons',sub:'48 × 8 × 8 in · Rails and trim',qty:'900 boxes',cond:'Very good',cur:760,nv:3420,bids:9,end:N+2*D+2*H,buy:1190,loc:'Goshen, Indiana',lot:'BB-1045',spec:{Material:'Kraft corrugated','Wall type':'Single-wall','Inside dimensions':'48 × 8 × 8 in','Use case':'Trim and long parts','Pickup window':'5 business days'},hist:[['Northern Trim','$760','Today 12:02 PM'],['eCom Warehouse','$700','Yesterday 5:18 PM']]},{id:'mailers',cat:'boxes',icon:'📬',title:'2,400 Self-Locking Mailer Boxes',sub:'12 × 9 × 4 in · White exterior',qty:'2,400 boxes',cond:'New overrun',cur:1320,nv:5280,bids:13,end:N+19*H,buy:1850,loc:'Middlebury, Indiana',lot:'BB-1046',spec:{Material:'White corrugated',Style:'Roll-end mailer','Board rating':'32 ECT','Inside dimensions':'12 × 9 × 4 in','Pickup window':'4 business days'},hist:[['CraftShip','$1,320','Today 3:41 PM'],['Lakefront Gifts','$1,250','Today 11:29 AM']]},{id:'pallets',cat:'pallets',icon:'🪵',title:'120 Standard Wood Pallets',sub:'48 × 40 in · Grade A/B mix',qty:'120 pallets',cond:'Grade A/B',cur:1260,nv:3240,bids:14,end:N+18*H,buy:1680,loc:'Elkhart, Indiana',lot:'BB-1047',spec:{Material:'Recycled hardwood',Dimensions:'48 × 40 in',Entry:'Four-way',Grade:'A/B mix','Pickup window':'3 business days'},hist:[['CrossDock Inc.','$1,260','Today 4:10 PM'],['Michiana Freight','$1,180','Today 12:20 PM']]},{id:'foam-sheets',cat:'foam',icon:'⬜',title:'96 Soft Foam Sheets',sub:'48 × 96 × 1 in · White',qty:'96 sheets',cond:'Clean surplus',cur:1180,nv:4512,bids:12,end:N+9*H,buy:1490,loc:'Elkhart, Indiana',lot:'BB-1048',spec:{Material:'Polyurethane foam',Dimensions:'48 × 96 × 1 in',Color:'White',Density:'Medium-soft','Pickup window':'4 business days'},hist:[['Custom Cushion Co.','$1,180','Today 4:39 PM'],['Upholstery Works','$1,100','Today 2:12 PM']]},{id:'foam-rolls',cat:'foam',icon:'🧻',title:'36 Polyethylene Foam Rolls',sub:'24 in × 550 ft × 1/8 in',qty:'36 rolls',cond:'New surplus',cur:1120,nv:2988,bids:8,end:N+3*D+15*H,buy:1550,loc:'Goshen, Indiana',lot:'BB-1049',spec:{Material:'Polyethylene foam','Roll width':'24 in','Roll length':'550 ft',Thickness:'1/8 in','Pickup window':'5 business days'},hist:[['PackPro','$1,120','Yesterday 3:02 PM'],['FulfillFast','$1,050','Yesterday 11:14 AM']]},{id:'foam-pads',cat:'foam',icon:'◼️',title:'400 Charcoal Foam Pads',sub:'24 × 24 × 1 in · Clean surplus',qty:'400 pads',cond:'Excellent',cur:980,nv:2940,bids:15,end:N+4*D+21*H,buy:1380,loc:'Elkhart, Indiana',lot:'BB-1050',spec:{Material:'Open-cell polyurethane',Dimensions:'24 × 24 × 1 in',Color:'Charcoal',Cut:'Square pad','Pickup window':'5 business days'},hist:[['Audio Case Works','$980','Today 10:52 AM'],['FoamFab','$920','Yesterday 2:22 PM']]},{id:'eps-blocks',cat:'foam',icon:'🧊',title:'48 Large EPS Foam Blocks',sub:'48 × 24 × 18 in · Dense white foam',qty:'48 blocks',cond:'Clean',cur:620,nv:2400,bids:6,end:N+2*D+18*H,buy:920,loc:'Bristol, Indiana',lot:'BB-1051',spec:{Material:'Expanded polystyrene',Dimensions:'48 × 24 × 18 in',Color:'White',Density:'1.5 lb','Pickup window':'5 business days'},hist:[['Lake Foam Fab','$620','Today 8:14 AM'],['DisplayWorks','$560','Yesterday 1:10 PM']]},{id:'mailing-tubes',cat:'tubes',icon:'🧵',title:'2,200 Heavy-Duty Mailing Tubes',sub:'3 × 36 in · Spiral-wound kraft',qty:'2,200 tubes',cond:'New surplus',cur:1450,nv:7040,bids:16,end:N+7*H,buy:2050,loc:'Elkhart, Indiana',lot:'BB-1052',spec:{Material:'Spiral-wound kraft','Inside diameter':'3 in',Length:'36 in','Wall thickness':'0.080 in',Caps:'Included','Pickup window':'4 business days'},hist:[['PosterShip','$1,450','Today 4:46 PM'],['Blueprint Supply','$1,390','Today 3:05 PM']]},{id:'paper-cores',cat:'tubes',icon:'🧻',title:'800 Industrial Paper Cores',sub:'6 in ID × 60 in long · Heavy wall',qty:'800 cores',cond:'Very good',cur:780,nv:3920,bids:5,end:N+D+23*H,buy:1180,loc:'Goshen, Indiana',lot:'BB-1053',spec:{Material:'Wound paperboard','Inside diameter':'6 in',Length:'60 in','Wall thickness':'3/8 in',Ends:'Open','Pickup window':'5 business days'},hist:[['RollWorks','$780','Today 9:40 AM'],['FilmTech','$700','Yesterday 2:43 PM']]},{id:'closed-gaylords',cat:'boxes',icon:'🏆',title:'180 Heavy-Duty Gaylord Boxes',sub:'48 × 40 × 36 in · Closed auction',qty:'180 boxes',cond:'Good reusable',cur:2475,nv:9540,bids:24,end:N-2*H,closed:true,winner:'Summit Components LLC',loc:'Elkhart, Indiana',lot:'BB-1039',spec:{Material:'Heavy corrugated',Style:'Octabin / Gaylord','Inside dimensions':'48 × 40 × 36 in',Bottoms:'Included','Pickup deadline':'July 20, 2026'},hist:[['Summit Components LLC','$2,475','Auction closed'],['M***n Manufacturing','$2,425','Final 2 minutes'],['Warehouse Direct','$2,300','Final 11 minutes']]}];let cat='all',sort='ending';const money=n=>'$'+n.toLocaleString(),time=ms=>{if(ms<=0)return'Closed';let d=Math.floor(ms/D),h=Math.floor(ms%D/H),m=Math.floor(ms%H/6e4);return(d?d+'d ':'')+String(h).padStart(2,'0')+'h '+String(m).padStart(2,'0')+'m'},save=l=>Math.round((1-l.cur/l.nv)*100),badge=l=>l.closed?'<span class="badge closed">Closed · Winner selected</span>':l.end-Date.now()<12*H?'<span class="badge ending">Ending soon</span>':'<span class="badge">Live auction</span>';function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}function card(l){return`<article class="lot" data-id="${l.id}"><div class="art">${badge(l)}${l.icon}</div><div class="body"><h3>${l.title}</h3><div class="meta">${l.sub}<br>${l.loc} · ${l.closed?'Closed':'Ends in '+time(l.end-Date.now())}</div><div class="compare"><div>Comparable new<strong><s>${money(l.nv)}</s></strong></div><div>${l.closed?'Final':'Current'} savings<strong>${save(l)}%</strong></div></div><div class="price"><div><span class="meta">${l.closed?'Winning':'Current'} bid</span><br><b>${money(l.cur)}</b></div><button class="bid">${l.closed?'View result':'View auction'}</button></div>${l.closed?`<div class="closednote">Won by ${l.winner}</div>`:'<div class="reserve">✓ Reserve met</div>'}</div></article>`}function home(){location.hash=''}function renderHome(){app.innerHTML=`<div class="wrap"><section class="hero"><span class="eyebrow">Industrial surplus, priced to move</span><h1>Bid on bulk goods.<br><span>Pay far less.</span></h1><p>Buy warehouse quantities of boxes, tubes, pallets, foam and packaging materials before they enter the recycling stream.</p><div class="stats"><div><b>12 live lots</b>across four categories</div><div><b>Pickup only</b>simple logistics</div><div><b>Reserve protected</b>never below scrap value</div></div></section></div><main><section class="section wrap"><div class="head"><div><h2>Surplus auctions</h2><p>Click any lot to open a full product detail page.</p></div><div class="filters">${['all','boxes','foam','tubes','pallets','closed'].map(x=>`<button class="filter ${cat===x?'active':''}" data-cat="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div></div><div class="searchbar"><input id="search" placeholder="Search size, material, quantity or lot number"><select id="sort"><option value="ending">Ending soonest</option><option value="price-low">Lowest bid</option><option value="price-high">Highest bid</option><option value="savings">Best savings</option></select></div><div class="grid" id="grid"></div></section><section class="section wrap"><div class="telegram"><div class="copy"><span class="eyebrow">Telegram-powered listing</span><h2>Talk to your bot. The lot goes live.</h2><p>Describe the material, upload photos, state the reserve and auction length, then approve the generated listing.</p></div><div class="chat"><div class="bubble mine">Create a lot: 2,200 tubes, 3×36, reserve $900, ends tomorrow at 6 PM.</div><div class="bubble"><b>BulkBid Bot</b><br>Draft created. Comparable new value: $7,040.</div><div class="bubble mine">Publish it.</div><div class="bubble"><b>BulkBid Bot</b><br>Auction published and buyer alerts sent.</div></div></div></section></main>`;document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;renderHome()});search.oninput=gridRender;document.getElementById('sort').value=sort;document.getElementById('sort').onchange=e=>{sort=e.target.value;gridRender()};gridRender()}function gridRender(){let q=(search.value||'').toLowerCase(),a=lots.filter(l=>(cat==='all'||(cat==='closed'?l.closed:l.cat===cat))&&(`${l.title} ${l.sub} ${l.qty} ${l.lot} ${Object.values(l.spec).join(' ')}`.toLowerCase().includes(q)));a.sort((a,b)=>sort==='price-low'?a.cur-b.cur:sort==='price-high'?b.cur-a.cur:sort==='savings'?save(b)-save(a):(a.closed?Infinity:a.end)-(b.closed?Infinity:b.end));grid.innerHTML=a.map(card).join('');document.querySelectorAll('.lot').forEach(e=>e.onclick=()=>location.hash='lot/'+e.dataset.id)}function detail(id){let l=lots.find(x=>x.id===id);if(!l)return home();let rel=lots.filter(x=>x.id!==l.id&&x.cat===l.cat).slice(0,3);app.innerHTML=`<main class="wrap detail"><div class="crumb"><button id="back">Auctions</button><span>›</span><span>${l.cat}</span><span>›</span><span>${l.lot}</span></div><div class="detailgrid"><section class="gallery"><div class="mainart">${l.icon}</div><div class="thumbs"><div class="thumb active">${l.icon}</div><div class="thumb">📐</div><div class="thumb">🏭</div><div class="thumb">🚚</div></div></section><aside class="side"><span class="filter">${l.cat.toUpperCase()}</span><h1>${l.title}</h1><p class="meta">${l.sub}<br>Lot ${l.lot} · Pickup in ${l.loc}</p><div class="timebox"><small>${l.closed?'Auction status':'Time remaining'}</small><div class="count" id="cnt">${l.closed?'Closed':time(l.end-Date.now())}</div><small>${l.closed?'Closed with '+l.bids+' total bids':'Closing times vary by lot'}</small></div><div class="metricrow"><div class="metric"><small>${l.closed?'Winning':'Current'} bid</small><b>${money(l.cur)}</b></div><div class="metric"><small>Comparable new</small><b><s>${money(l.nv)}</s></b></div><div class="metric"><small>Total bids</small><b>${l.bids}</b></div><div class="metric"><small>Savings</small><b>${save(l)}%</b></div></div>${l.closed?`<div class="winner">🏆 Winning bidder: ${l.winner}<br><span class="meta">Pickup scheduled and payment confirmed.</span></div>`:`<div class="bidbox"><input id="dbid" type="number" value="${l.cur+25}"><button class="btn" id="pbid">Place bid</button></div><button class="buy" id="buy">Buy now for ${money(l.buy)}</button><div class="reserve">✓ Reserve met · Highest qualified bid wins</div>`}</aside></div><div class="detailsbelow"><section class="specs"><h2>Lot details</h2><p class="meta">Entire lot sold as one unit. Buyer is responsible for pickup and removal.</p><div class="specgrid">${Object.entries(l.spec).map(([k,v])=>`<div class="spec"><small>${k}</small><strong>${v}</strong></div>`).join('')}<div class="spec"><small>Quantity</small><strong>${l.qty}</strong></div><div class="spec"><small>Condition</small><strong>${l.cond}</strong></div></div></section><section class="history"><h2>Bid history</h2>${l.hist.map(r=>`<div class="historyrow"><div><strong>${r[0]}</strong><br><span class="meta">${r[2]}</span></div><strong>${r[1]}</strong></div>`).join('')}</section></div><section class="related"><h2>More ${l.cat}</h2><div class="grid">${rel.map(card).join('')}</div></section></main>`;back.onclick=home;document.querySelectorAll('.lot').forEach(e=>e.onclick=()=>location.hash='lot/'+e.dataset.id);if(!l.closed){pbid.onclick=()=>{let v=+dbid.value;if(v<=l.cur)return toast('Bid must exceed current bid.');l.cur=v;l.bids++;l.hist.unshift(['You',money(v),'Just now']);toast('Demo bid accepted. You are the high bidder.');detail(l.id)};buy.onclick=()=>toast('Demo only: checkout would open here.')}}function route(){let m=location.hash.match(/^#lot\/(.+)$/);m?detail(m[1]):renderHome()}homeLogo.onclick=home;browseBtn.onclick=home;alertsBtn.onclick=()=>toast('Buyer alert saved for boxes, foam and tubes.');window.onhashchange=route;route();</script></body></html>
